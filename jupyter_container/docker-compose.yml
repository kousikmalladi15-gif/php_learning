services:
  jupyter-php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter-php
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    restart: unless-stopped
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=''
      --ServerApp.token=''
      --ServerApp.password=''
      --ServerApp.allow_origin='*'
      --ServerApp.disable_check_xsrf=True